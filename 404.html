<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      const path = location.pathname + location.search + location.hash;

      // Avoid duplicate /Postqi if it's already in the path
      const redirectPath = path.startsWith("/Postqi") ? path : "/Postqi" + path;

      location.replace(redirectPath);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
