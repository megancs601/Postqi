<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      // Grab the current full path
      const redirectPath =
        "/Postqi" + location.pathname + location.search + location.hash;
      // Redirect to index.html with the original path encoded as a hash
      location.replace(redirectPath);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
